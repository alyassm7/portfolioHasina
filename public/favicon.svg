<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HR">
  <defs>
    <linearGradient id="hr-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#120A2A"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#hr-gradient)" stroke-width="2" opacity="0.9"/>
  <text x="32" y="42" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="url(#hr-gradient)" filter="url(#glow)">HR</text>
</svg>
